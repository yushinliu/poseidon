# ============================================================
# Poseidon 配置示例。
# 复制为 config.yaml 并填入真实值（config.yaml 不入库）。
# 所有字段均可被环境变量覆盖（见注释中的 POSEIDON_*）。
# ============================================================

server:
  host: 0.0.0.0            # 监听地址
  port: 8000               # Web 端口，环境变量 POSEIDON_PORT

llm:
  base_url: https://api.deepseek.com        # POSEIDON_LLM_BASE_URL
  api_key: "sk-xxxxxxxx"                    # POSEIDON_LLM_API_KEY（必填）
  model: deepseek-v4-pro                    # 默认模型；可选 deepseek-v4-flash
  max_tokens: 16384                         # 注意：deepseek-v4-pro 为推理模型，输出预算需覆盖推理+代码
  temperature: 0
  timeout_ms: 600000                        # 单次 LLM 调用超时
  max_retries: 3                            # 失败后自动修复的最大轮数（不含首次生成）

build_machine:
  host: 10.2.118.21                         # 构建/测试机，POSEIDON_SSH_HOST
  port: 22
  username: yuliu                           # POSEIDON_SSH_USER
  password: "1"                             # POSEIDON_SSH_PASSWORD（必填）
  workdir: ~/ws/poseidon/runs                # 作业运行目录（每次作业一个子目录）
  whl_dir: ~/ws/poseidon/whl                 # mcTriton/mcPytorch whl 包目录（按版本分子目录）
  sdk_dirs:                                  # SDK 扫描目录（用于 Web 下拉框）
    - /opt/maca
    - /opt/maca-3.7.0
  base_python: ~/miniforge3/envs/yuliu/bin/python   # 用于创建 venv 的 Python 3.12
  venvs_dir: ~/ws/poseidon/venvs             # 每个 whl 版本一套 venv
  pip_index_url: ""                          # 为空则使用构建机默认 pip 源
  # 指定 whl 版本直接使用已有解释器（跳过 venv 创建）：
  python_overrides:
    "3.7.1.3-dsv4": ~/miniforge3/envs/yuliu/bin/python
  run_timeout_ms: 900000                     # 单次运行（编译+精度+性能）总超时
  stall_timeout_ms: 240000                   # 无输出停滞超时：超时先强杀远端进程（释放 GPU）再自动重试
  connect_timeout_ms: 20000

benchmark:
  warmup: 5
  iters: 50
  default_rtol: 0.02
  default_atol: 0.02

jobs:
  max_concurrent: 1        # GPU 独占，串行执行
  keep_dir: true           # 保留作业目录（含生成代码与日志）
